name: redtaxi
description: RedTaxi — ride-hailing app (customer + driver, role chosen at login).
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  # state + routing
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2

  # networking + realtime
  dio: ^5.7.0
  socket_io_client: ^2.0.3+1
  connectivity_plus: ^6.1.0

  # storage
  shared_preferences: ^2.3.4

  # maps + location
  google_maps_flutter: ^2.9.0
  geolocator: ^13.0.2
  geocoding: ^3.0.0
  permission_handler: ^11.3.1
  flutter_foreground_task: ^8.17.0

  # push
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.5
  flutter_local_notifications: ^18.0.1

  # payments
  razorpay_flutter: ^1.3.7

  # ui / misc
  intl: ^0.19.0
  equatable: ^2.0.5
  url_launcher: ^6.3.1
  smooth_page_indicator: ^1.2.0+3
  image_picker: ^1.1.2

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
